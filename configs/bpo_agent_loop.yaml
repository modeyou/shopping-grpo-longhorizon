- name: shopping_bpo_agent
  _target_: shopping_grpo.training.bpo.agent_loop.ShoppingBPOAgentLoop
  base_url: ${oc.env:SHOPSIM_BASE_URL,http://127.0.0.1:5700}
  timeout: 60
  max_steps: 35
  required_environment_version: shopsimulator-environment-v2.1
  required_reward_version: shopsimulator-reward-v4
  reward_mode: constraint_aware
  reward_shaping_profile: none
  reward_length_shaping_enable: false
  multiturn_enable: true
  shopper_model: ${oc.env:SHOPPER_MODEL}
  shopper_base_url: ${oc.env:SHOPPER_BASE_URL}
  shopper_api_key: ${oc.env:SHOPPER_API_KEY}
  shopper_timeout: ${oc.env:SHOPPER_TIMEOUT,120}
  shopper_max_tokens: ${oc.env:SHOPPER_MAX_TOKENS,512}
  max_shopper_questions: 2
  context_window_tokens: 24576
  context_generation_reserve_tokens: 512
  context_safety_margin_tokens: 512
  context_input_budget_tokens: 16384
  context_preserve_recent_groups: 1
  context_compaction_enable: false
  observation_token_budget: 1536
  observation_detail_token_budget: 4096
  observation_generic_token_budget: 768
  observation_search_top_k: 20
  sibling_count: 4
  branch_count: 1
  entropy_probe: exact-full-vocabulary
