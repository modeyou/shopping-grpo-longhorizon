# CARL-BPO configuration (independent from configs/grpo.yaml).
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:BPO_TRAIN_FILE}
  val_files: ${oc.env:BPO_VAL_FILE}
  train_batch_size: 2
  val_batch_size: 2
  # Formal parquet is small; avoid multiprocessing DataLoader teardown noise.
  dataloader_num_workers: 0
  seed: ${oc.decode:${oc.env:BPO_SEED,20260823}}
  max_prompt_length: 4096
  max_response_length: 20480
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:BPO_MODEL_PATH}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    # Fuse the output head so long-sequence actor updates do not materialize
    # the complete sequence-by-vocabulary logits tensor.
    use_remove_padding: true
    use_fused_kernels: true
    use_liger: true
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
    lora:
      merge: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 2
    data_loader_seed: ${oc.decode:${oc.env:BPO_SEED,20260823}}
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 24576
    use_dynamic_bsz: false
    freeze_vision_tower: true
    # v3 encodes per-action weights in advantages and removes inactive Local
    # tokens before this native veRL sequence/token mean.
    loss_agg_mode: seq-mean-token-mean
    clip_ratio_low: 0.20
    clip_ratio_high: 0.20
    entropy_coeff: 0.0
    # Branch entropy is measured by the dedicated one-token vLLM probe.
    calculate_entropy: false
    use_kl_loss: false
    kl_loss_coef: 0.0
    optim:
      lr: 1.0e-6
      lr_warmup_steps: 10
      lr_scheduler_type: cosine
      min_lr_ratio: 0.1
    fsdp_config:
      optimizer_offload: true
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    # Original formal rollout budget; preflight requires four clean visible GPUs.
    gpu_memory_utilization: 0.45
    max_num_seqs: 8
    max_model_len: 24576
    max_num_batched_tokens: 24576
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    log_prob_use_dynamic_bsz: false
    engine_kwargs:
      vllm:
        max_logprobs: -1
    agent:
      # Each worker receives one contiguous K=4 sibling group.
      num_workers: 2
      default_agent_loop: shopping_bpo_agent
      agent_loop_config_path: ${oc.env:SHOPPING_BPO_ROOT}/configs/bpo_agent_loop.yaml
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 40
      max_assistant_turns: 40
      max_parallel_calls: 1
      max_tool_response_length: 16384
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_BPO_ROOT}/configs/tools.json
      tokenization_sanity_check_mode: ignore_strippable
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: bpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  bpo:
    sibling_count: 4
    branch_count: 1
  rollout_correction:
    bypass_mode: true
    rollout_is: null
    rollout_rs: null
    loss_type: ppo_clip

shopping_bpo:
  enable: true
  algorithm: carl-bpo-v3
  sibling_count: 4
  branch_count: 1
  return_budget: 4
  selection: maximum_exact_entropy_with_semantic_gate
  entropy_tie_break: earliest_action
  entropy_probe: exact-full-vocabulary
  entropy_state: action-boundary-first-token
  rollout_audit: exact-tree-v2
  semantic_action_contract: canonical-tool-arguments-v1
  local_credit_support: branch-action-only-v1
  policy_loss: action-balanced-root-local-v1
  group_schedule: [root, local]
  # Driver-owned weighted-fair coverage; at 500 Local groups this is 200/175/125.
  local_stage_weights:
    product: 8
    option: 7
    search_strategy: 5
  train_return_version: completion-aligned-v1
  gold_train_return: 1.25
  valid_alternative_train_return: 1.0
  # CARL budget: 500 updates x 2 groups x K=4 sibling returns.
  effective_tree_budget: 1000
  effective_return_budget: 4000

shopping_dynamic_sampling:
  enable: true
  metric: seq_reward
  # One global step is one Root plus one Local K=4 group.
  minimum_accepted_prompts: 2
  require_full_batch: true
  # Keep improving both Root/Local reservoirs through batch 10 unless both are goal contrasts.
  quality_search_gen_batches: 10
  # Keep the exact Root/Local target and retain each valid reservoir entry until
  # the pair is complete. Batch 120 is the emergency hard stop, not a fallback.
  max_num_gen_batches: 120
  checkpoint_steps: [25, 50, 75, 100, 125, 150, 175, 200, 225, 250, 275, 300, 325, 350, 375, 400, 425, 450, 475, 500]
  validation_steps: [10, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500]
  max_consecutive_skipped_updates: 10
  reward_tolerance: 1.0e-8

reward_model:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.training.bpo.runtime.worker_process_setup_hook

trainer:
  total_epochs: 50
  # CARL upper bound: 500 updates x 2 groups x 4 sibling returns = R4000.
  total_training_steps: 500
  save_freq: 25
  max_actor_ckpt_to_keep: 20
  test_freq: 50
  val_before_train: true
  logger: [console]
  project_name: shopping-multiturn-agentic
  experiment_name: carl-bpo-v3-step500-r4000-seed20260823
  default_local_dir: ${oc.env:BPO_OUTPUT_DIR}
  n_gpus_per_node: 4
  nnodes: 1
